<template>
    <lightning-card title="Approval Matrix Verification" icon-name="standard:approval">
        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert">{error}</div>
        </template>
        <template lwc:if={requestView}>
            <div class="slds-p-horizontal_medium slds-p-top_small">
                <p>
                    <strong>{requestView.requestRecord.Name}</strong>
                    <span class="slds-p-left_small">{requestView.requestRecord.Status__c}</span>
                    <span class="slds-p-left_small">{requestView.requestRecord.Record_Type__c}</span>
                </p>
                <p>ClickUp task: {requestView.requestRecord.ClickUp_Task_Id__c}</p>
                <template lwc:if={requestView.requestRecord.Processing_Error__c}>
                    <div class="slds-text-color_error slds-m-top_x-small" role="alert">
                        {requestView.requestRecord.Processing_Error__c}
                    </div>
                </template>
            </div>
            <div class="slds-p-around_medium">
                <lightning-datatable
                    key-field="Id"
                    data={rows}
                    columns={columns}
                    selected-rows={selectedLineIds}
                    disabled-rows={disabledRowIds}
                    onrowselection={handleSelection}
                    show-row-number-column>
                </lightning-datatable>
            </div>
            <div class="slds-grid slds-wrap slds-p-horizontal_medium slds-p-bottom_medium">
                <lightning-button
                    label="Approve selected"
                    variant="brand"
                    onclick={handleApproveSelected}
                    disabled={approvalDisabled}
                    class="slds-m-right_small slds-m-bottom_small">
                </lightning-button>
                <lightning-button
                    label="Approve all valid lines"
                    onclick={handleApproveAll}
                    disabled={approvalDisabled}
                    class="slds-m-right_small slds-m-bottom_small">
                </lightning-button>
                <lightning-textarea
                    label="Rejection reason"
                    value={rejectionReason}
                    onchange={handleReasonChange}
                    class="rejection-reason slds-m-right_small slds-m-bottom_small">
                </lightning-textarea>
                <lightning-button
                    label="Reject request"
                    variant="destructive"
                    onclick={handleReject}
                    disabled={rejectDisabled}
                    class="slds-m-bottom_small">
                </lightning-button>
            </div>
        </template>
        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving request" size="small"></lightning-spinner>
        </template>
    </lightning-card>
</template>
