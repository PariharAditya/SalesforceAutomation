<template>
    <lightning-card title="Approval Matrix ClickUp" icon-name="standard:approval">
        <div class="slds-p-around_medium">
            <p>
                ClickUp Lighting tasks are polled from the configured List and handoff status.
                Review the Item, GM, AGM, and RM values here; only verifier approval writes
                to the existing ApprovalMatrix object.
            </p>
            <template lwc:if={syncStatus}>
                <p class="slds-m-top_small">
                    List: {syncStatus.listId} | Handoff: {syncStatus.handoffStatus}
                </p>
                <template lwc:if={syncStatus.lastPollAt}>
                    <p>Last poll: {syncStatus.lastPollAt}</p>
                </template>
                <template lwc:if={syncStatus.lastPollError}>
                    <p class="slds-text-color_error" role="alert">
                        Last poll error: {syncStatus.lastPollError}
                    </p>
                </template>
            </template>
        </div>
        <div class="slds-border_top slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_small">
                <h2 class="slds-text-heading_small slds-grow">ClickUp requests</h2>
                <lightning-button
                    class="slds-m-right_x-small"
                    label="Sync ClickUp now"
                    onclick={handleSync}
                    disabled={isSaving}>
                </lightning-button>
                <lightning-button
                    label="Refresh"
                    onclick={handleRefresh}
                    disabled={isSaving}>
                </lightning-button>
            </div>
            <template lwc:if={error}>
                <div class="slds-text-color_error slds-m-bottom_small" role="alert">{error}</div>
            </template>
            <lightning-datatable
                key-field="Id"
                data={requests}
                columns={columns}
                max-row-selection="1"
                onrowselection={handleSelection}>
            </lightning-datatable>
        </div>
        <template lwc:if={hasSelection}>
            <div class="slds-border_top slds-p-around_medium">
                <c-approval-matrix-clickup-verification
                    record-id={selectedRequestId}
                    onrequestupdated={handleRequestUpdated}>
                </c-approval-matrix-clickup-verification>
            </div>
        </template>
    </lightning-card>
</template>
